name: Validate Lean Lemur n8n

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/lean-lemur/**'
      - '.github/workflows/validate-lean-lemur-n8n.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static contract checks
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('ci/lean-lemur')
          files = [root/'lean_lemur_openscale_ingest.n8n.json', root/'lean_lemur_weight_distribution.n8n.json']
          for path in files:
              wf=json.load(open(path))
              assert wf.get('id'), f'{path}: missing workflow id'
              assert wf.get('active') is False
              assert wf['settings']['timezone']=='Asia/Manila'
              names=[n['name'] for n in wf['nodes']]
              assert len(names)==len(set(names))
              for src,bundle in wf.get('connections',{}).items():
                  assert src in names
                  for out in bundle.get('main',[]):
                      for edge in out:
                          assert edge['node'] in names
          ingest=open(files[0]).read()
          dist=open(files[1]).read()
          assert 'n8n-nodes-base.executeCommand' not in ingest
          assert 'n8n-nodes-base.readWriteFile' not in ingest
          for token in ['openscale-parse-backup','lean_lemur.scale_measurements','ON CONFLICT (measurement_key)','openscale_eufy_t9120']:
              assert token in ingest, token
          for token in ['airtable_ifttt_apple_health','fitbit_trendweight','api.airtable.com','api.fitbit.com/1/user/-/body/log/weight.json','FOR UPDATE SKIP LOCKED','next_attempt_at','created_at']:
              assert token in dist, token
          print('PASS static contracts')
          PY

      - name: Smoke-test deployed OpenScale parser
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sqlite3, tempfile, zipfile
          d=pathlib.Path(tempfile.mkdtemp(prefix='openscale-ci-'))
          db=d/'openScale.db'
          con=sqlite3.connect(db)
          con.execute('PRAGMA journal_mode=WAL')
          con.executescript('''
          CREATE TABLE Measurement (id INTEGER PRIMARY KEY, userId INTEGER, timestamp INTEGER);
          CREATE TABLE MeasurementType (id INTEGER PRIMARY KEY, key TEXT);
          CREATE TABLE MeasurementValue (measurementId INTEGER, typeId INTEGER, floatValue REAL);
          INSERT INTO Measurement VALUES (1,1,1788582060684);
          INSERT INTO MeasurementType VALUES (1,'WEIGHT'),(2,'BODY_FAT'),(3,'WATER'),(4,'MUSCLE'),(5,'BONE'),(6,'BMI');
          INSERT INTO MeasurementValue VALUES (1,1,81.0),(1,2,22.910965),(1,3,55.0),(1,4,40.0),(1,5,3.1),(1,6,24.45);
          ''')
          con.commit()
          z=pathlib.Path('/tmp/openscale-ci.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as out:
              for name in ('openScale.db','openScale.db-wal','openScale.db-shm'):
                  p=d/name
                  assert p.exists(), name
                  out.write(p,arcname=name)
          con.close()
          PY
          status=$(curl -sS -X POST \
            -H 'Content-Type: application/zip' \
            --data-binary @/tmp/openscale-ci.zip \
            -o /tmp/parser.json \
            -w '%{http_code}' \
            https://cfoleiwmizgayhecyymq.supabase.co/functions/v1/openscale-parse-backup)
          cat /tmp/parser.json
          echo
          test "$status" = "200"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/parser.json'))
          assert x['count']==1, x
          m=x['measurements'][0]
          assert m['measurement_id']==1, m
          assert abs(float(m['weight_kg'])-81.0)<1e-9, m
          assert abs(float(m['bodyfat_pct'])-22.910965)<1e-9, m
          print('PASS deployed parser')
          PY

      - name: Import OpenScale ingest into n8n 1.113.3
        run: docker run --rm -v "$PWD/ci/lean-lemur:/workflows:ro" n8nio/n8n:1.113.3 import:workflow --input=/workflows/lean_lemur_openscale_ingest.n8n.json

      - name: Import weight distribution into n8n 1.113.3
        run: docker run --rm -v "$PWD/ci/lean-lemur:/workflows:ro" n8nio/n8n:1.113.3 import:workflow --input=/workflows/lean_lemur_weight_distribution.n8n.json
